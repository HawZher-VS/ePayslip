<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ePayslip v2 â VX HRMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* âââ Design Tokens v2 ââââââââââââââââââââââââââââââââââââ */
    :root {
      /* Brand */
      --primary:       #5865F2;
      --primary-dark:  #4752d9;
      --primary-light: #eef0fd;
      --primary-mid:   #c7cbfb;

      /* Semantic */
      --success:       #2DCE89;
      --success-light: #e6faf3;
      --danger:        #F5365C;
      --danger-light:  #feeaee;
      --warning:       #FB6340;
      --warning-light: #fff0eb;
      --info:          #11CDEF;
      --info-light:    #e0f9ff;

      /* Text */
      --text-primary:  #1a1f36;
      --text-secondary:#6b7280;
      --text-tertiary: #9ca3af;

      /* Surfaces */
      --surface-1:     #ffffff;
      --surface-2:     #f8f9fc;
      --surface-3:     #f0f2f5;

      /* Borders */
      --border:        #e5e7eb;
      --border-strong: #d1d5db;

      --link:          #5865F2;
      --table-header:  #f8f9fc;

      /* Chart segment colors (from active palette) */
      --c-basic:       #6B6FD4;
      --c-bonus:       #4BC98A;
      --c-allowance:   #E8653A;
      --c-deduction:   #E05A6E;

      --radius-sm:  4px;
      --radius:     8px;
      --radius-lg:  12px;
      --radius-xl:  16px;

      --shadow-card:       0 1px 4px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
      --shadow-card-hover: 0 4px 16px rgba(0,0,0,.08), 0 1px 4px rgba(0,0,0,.04);

      /* Guideline-aligned aliases */
      --brand:        var(--primary);
      --brand-light:  var(--primary-light);
      --brand-mid:    var(--primary-mid);
      --surface:      var(--surface-1);
      --bg-page:      var(--surface-3);
      --font:         'Inter', system-ui, -apple-system, sans-serif;
      --r-sm:         var(--radius-sm);
      --r:            var(--radius);
      --r-lg:         var(--radius-lg);
      --r-xl:         var(--radius-xl);
      --shadow-sm:    var(--shadow-card);
      --shadow-md:    var(--shadow-card-hover);
    }

    /* âââ Reset & Base ââââââââââââââââââââââââââââââââââââââââ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      color: var(--text-primary);
      background: var(--surface-3);
      min-height: 100vh;
      display: flex;
    }

    /* âââ Sidebar ââââââââââââââââââââââââââââââââââââââââââââââ */
    .sidebar {
      width: 64px;
      min-height: 100vh;
      background: var(--surface-1);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 12px 0;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 200;
      overflow: hidden;
      transition: width 0.22s cubic-bezier(.4,0,.2,1);
      flex-shrink: 0;
    }
    .sidebar:hover {
      width: 210px;
      box-shadow: var(--shadow-card-hover);
    }

    /* Logo row */
    .sb-logo-row {
      display: flex; align-items: center; gap: 10px;
      padding: 0 11px; margin-bottom: 10px; width: 210px; flex-shrink: 0;
    }
    .sb-logo {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--primary);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .sb-logo svg { width: 22px; height: 22px; }
    .sb-logo-full {
      font-size: 14px; font-weight: 700; color: var(--primary);
      white-space: nowrap; opacity: 0; transition: opacity 0.15s 0.05s;
      letter-spacing: .5px;
    }
    .sidebar:hover .sb-logo-full { opacity: 1; }

    /* Avatar row */
    .sb-avatar-row {
      display: flex; align-items: center; gap: 10px;
      padding: 0 13px; margin-bottom: 4px; width: 210px; flex-shrink: 0;
    }
    .sb-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--text-tertiary);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .sb-avatar svg { width: 22px; height: 22px; }
    .sb-avatar-info { opacity: 0; transition: opacity 0.15s 0.05s; white-space: nowrap; }
    .sidebar:hover .sb-avatar-info { opacity: 1; }
    .sb-avatar-name { font-size: 12px; font-weight: 600; color: var(--text-primary); }
    .sb-avatar-role { font-size: 10px; color: var(--text-secondary); }

    /* Back row */
    .sb-back-row {
      display: flex; align-items: center; gap: 10px;
      padding: 4px 13px; margin-bottom: 6px; width: 210px; cursor: pointer;
      color: var(--danger); flex-shrink: 0; border-radius: 0;
      transition: background .15s;
    }
    .sb-back-row:hover { background: var(--danger-light); }
    .sb-back-icon { width: 36px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .sb-back-label {
      font-size: 12px; font-weight: 600; opacity: 0;
      transition: opacity 0.15s 0.05s; white-space: nowrap;
    }
    .sidebar:hover .sb-back-label { opacity: 1; }

    .sb-divider {
      width: 36px; height: 1px; background: var(--border);
      margin: 6px 14px; transition: width 0.22s; flex-shrink: 0;
    }
    .sidebar:hover .sb-divider { width: 182px; }

    /* Section label */
    .sb-section-label {
      font-size: 10px; font-weight: 700; color: var(--text-secondary);
      letter-spacing: .5px; padding: 0 16px; margin-bottom: 2px;
      opacity: 0; transition: opacity 0.1s; white-space: nowrap;
      width: 210px; flex-shrink: 0; text-transform: uppercase;
    }
    .sidebar:hover .sb-section-label { opacity: 1; }

    /* Nav item */
    .sb-item {
      width: 210px; height: 40px; display: flex; flex-direction: row;
      align-items: center; cursor: pointer; flex-shrink: 0;
      color: var(--text-secondary);
      transition: background 0.15s, color 0.15s;
      padding: 0 13px; border-radius: 0;
    }
    .sb-item:hover { background: var(--surface-3); color: var(--text-primary); }
    .sb-item.active { background: var(--primary-light); color: var(--primary); }
    .sb-item-icon {
      width: 36px; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0;
    }
    .sb-item-icon svg { width: 18px; height: 18px; }
    .sb-item-label {
      font-size: 12px; font-weight: 500; white-space: nowrap;
      opacity: 0; transition: opacity 0.12s 0.05s; flex: 1;
    }
    .sidebar:hover .sb-item-label { opacity: 1; }
    .sb-item-abbr {
      font-size: 9px; font-weight: 700; letter-spacing: .3px;
      opacity: 1; transition: opacity .1s; margin-left: 2px;
    }
    .sidebar:hover .sb-item-abbr { opacity: 0; width: 0; overflow: hidden; margin: 0; }

    /* Icon btn (approver / logout etc) */
    .sb-icon-btn {
      width: 210px; height: 40px; display: flex; align-items: center;
      cursor: pointer; color: var(--text-secondary); flex-shrink: 0;
      transition: background .15s; padding: 0 13px; gap: 0;
    }
    .sb-icon-btn:hover { background: var(--surface-3); }
    .sb-icon-btn.active { background: var(--primary-light); color: var(--primary); }
    .sb-icon-btn.red { color: var(--danger); }
    .sb-icon-btn.green { color: var(--success); }
    .sb-icon-btn-icon {
      width: 36px; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0;
    }
    .sb-icon-btn-icon svg { width: 18px; height: 18px; }
    .sb-icon-btn-label {
      font-size: 12px; font-weight: 500; white-space: nowrap;
      opacity: 0; transition: opacity 0.12s 0.05s; flex: 1;
    }
    .sidebar:hover .sb-icon-btn-label { opacity: 1; }
    .sb-chevron {
      margin-left: auto; font-size: 10px; color: var(--text-secondary);
      opacity: 0; transition: opacity 0.12s 0.05s, transform 0.2s;
    }
    .sidebar:hover .sb-chevron { opacity: 1; }
    .sb-chevron.open { transform: rotate(180deg); color: var(--info); }

    /* Submenu */
    .sb-submenu {
      width: 210px; overflow: hidden; max-height: 0;
      transition: max-height 0.22s ease; flex-shrink: 0;
    }
    .sb-submenu.open { max-height: 400px; }
    .sb-subitem {
      width: 210px; height: 38px; display: flex; align-items: center;
      padding: 0 13px 0 0; cursor: pointer; color: var(--text-secondary);
      transition: background .15s, color .15s;
    }
    .sb-subitem:hover { background: var(--surface-3); color: var(--text-primary); }
    .sb-subitem.active { background: var(--primary-light); color: var(--primary); }
    .sb-subitem-icon {
      width: 52px; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0;
    }
    .sb-subitem-abbr { font-size: 9px; font-weight: 700; color: inherit; opacity: 0; transition: opacity .1s; }
    .sidebar:hover .sb-subitem-abbr { opacity: 1; }

    /* Letter badge icon (replaces svg for text-initial items) */
    .sb-letter-badge {
      width: 22px; height: 22px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; flex-shrink: 0;
    }

    /* Sub-group label inside submenu */
    .sb-subitem-group-label {
      font-size: 9px; font-weight: 700; letter-spacing: .5px;
      text-transform: uppercase; color: var(--text-secondary);
      padding: 8px 0 3px 52px;
      opacity: 0; transition: opacity .12s .05s;
      white-space: nowrap; width: 210px;
    }
    .sidebar:hover .sb-subitem-group-label { opacity: 1; }
    .sb-subitem-label {
      font-size: 12px; font-weight: 400; white-space: nowrap;
      opacity: 0; transition: opacity 0.12s 0.05s; flex: 1;
    }
    .sidebar:hover .sb-subitem-label { opacity: 1; }

    /* âââ Main wrapper (sits beside sidebar) ââââââââââââââââââ */
    .main-wrap {
      margin-left: 64px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-width: 0;
    }

    /* âââ Top Bar âââââââââââââââââââââââââââââââââââââââââââââ */
    .topbar {
      display: flex;
      align-items: center;
      padding: 20px 0 8px;
    }
    .topbar-inner {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 0;
      display: flex;
      align-items: center;
    }
    .topbar-left {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .topbar-icon {
      width: 32px; height: 32px;
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      color: var(--text-secondary);
    }
    .topbar-icon svg { width:18px; height:18px; }
    .topbar-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: .1px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .topbar-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 20px;
      background: var(--primary);
      border-radius: 2px;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 10px;
      flex-shrink: 0;
    }
    .btn-icon {
      width: 34px; height: 34px;
      border: none; background: none; cursor: pointer;
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-secondary);
      transition: background .15s, color .15s;
    }
    .btn-icon:hover { background: var(--surface-3); color: var(--text-primary); }
    .btn-icon svg { width:18px; height:18px; }

    /* âââ Page Layout âââââââââââââââââââââââââââââââââââââââââ */
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 0 48px;
      width: 100%;
    }

    /* âââ Page Title Row ââââââââââââââââââââââââââââââââââââââ */
    .page-title-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
    }
    .page-title-actions {
      display: flex;
      gap: 8px;
    }

    /* âââ Period Selector Row âââââââââââââââââââââââââââââââââ */
    .period-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Period navigator: < March 2026 > */
    .period-nav {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--surface-1);
      border-radius: var(--radius);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    .period-nav-btn {
      width: 34px; height: 38px;
      border: none; background: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-secondary);
      transition: background .15s, color .15s;
      flex-shrink: 0;
    }
    .period-nav-btn:hover { background: var(--surface-3); color: var(--primary); }
    .period-nav-btn svg { width: 16px; height: 16px; }
    .period-nav-label {
      display: flex; align-items: center; gap: 8px;
      padding: 0 8px;
      font-size: 14px; font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      height: 38px;
      min-width: 140px;
      justify-content: center;
    }
    .period-nav-cal { color: var(--text-secondary); width: 15px; height: 15px; }

    /* Cycle pills row */
    .cycle-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .cycle-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: .3px;
      margin-right: 4px;
    }
    .cycle-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px; font-weight: 600;
      letter-spacing: .3px;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: var(--surface-1);
      color: var(--text-secondary);
      transition: background .15s, color .15s, border-color .15s;
      white-space: nowrap;
    }
    .cycle-pill:hover { border-color: var(--primary); color: var(--primary); }
    .cycle-pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .cycle-pill-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }
    .cycle-pill.active .cycle-pill-dot { background: rgba(255,255,255,.6); }
    .cycle-pill:not(.active) .cycle-pill-dot { background: var(--primary); }

    /* Tab Group â pill style */
    .tab-group {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--surface-1);
      border: none;
      border-radius: 999px;
      padding: 4px;
      box-shadow: var(--shadow-card);
    }
    .tab-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 16px;
      border: none;
      background: none;
      border-radius: 999px;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, color .15s;
    }
    .tab-btn.active {
      background: var(--surface-1);
      color: var(--primary);
      font-weight: 600;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--primary-mid);
    }
    .tab-btn:not(.active):hover { background: var(--surface-3); color: var(--text-primary); }
    .tab-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }

    /* âââ Summary KPI Cards âââââââââââââââââââââââââââââââââââ */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }
    @media(max-width:900px) { .kpi-grid { grid-template-columns: repeat(2,1fr); } }
    @media(max-width:520px) { .kpi-grid { grid-template-columns: 1fr 1fr; } }

    .kpi-card {
      background: var(--surface-1);
      border: none;
      border-radius: var(--radius-lg);
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: var(--shadow-card);
      transition: box-shadow .2s, transform .2s;
    }
    .kpi-card:hover { box-shadow: var(--shadow-card-hover); transform: translateY(-2px); }
    .kpi-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: .4px;
      text-transform: uppercase;
    }
    .kpi-value {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -.3px;
      line-height: 1.2;
    }
    .kpi-currency {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-secondary);
      margin-right: 2px;
    }
    .kpi-trend {
      font-size: 12px;
      color: var(--success);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 3px;
      margin-top: 2px;
    }
    .kpi-trend.negative { color: var(--danger); }
    .kpi-trend svg { width:12px; height:12px; }
    .kpi-sub {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 3px;
      line-height: 1.5;
    }

    /* âââ Main Content Grid âââââââââââââââââââââââââââââââââââ */
    .content-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* âââ Chart Card ââââââââââââââââââââââââââââââââââââââââââ */
    .chart-card {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      transition: border-color .2s, box-shadow .2s;
    }
    .chart-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-card-hover); }
    .bc-header {
      padding: 14px 24px 0;
      display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap;
    }
    .bc-title { font-size: 15px; font-weight: 700; color: var(--text-primary); letter-spacing: -.2px; flex: 1; }
    .bc-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .bc-chip {
      font-size: 10px; font-weight: 600; letter-spacing: .3px;
      padding: 3px 10px; border-radius: 999px; text-transform: uppercase;
    }
    .bc-chip.green { background: var(--success-light); color: var(--success); border: 1px solid rgba(45,206,137,.3); }
    .bc-chip.red   { background: var(--danger-light);  color: var(--danger);  border: 1px solid rgba(245,54,92,.3); }
    .bar-section { padding: 14px 24px 0; }
    .bar-track {
      height: 32px; border-radius: var(--radius-sm);
      overflow: hidden; display: flex;
      background: var(--surface-3); border: 1px solid var(--border);
    }
    .bar-seg {
      height: 100%; display: flex; align-items: center; justify-content: center;
      overflow: hidden; min-width: 0;
      transition: flex .6s cubic-bezier(.4,0,.2,1);
    }
    .bar-seg-lbl {
      font-size: 9px; font-weight: 700;
      color: rgba(255,255,255,0.9); letter-spacing: .3px; padding: 0 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }

    .flow-row { display: flex; align-items: stretch; padding: 12px 24px 14px; gap: 0; }
    .flow-node {
      flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
      padding: 12px 18px; border-radius: var(--radius);
      background: var(--surface-2); border: 1px solid var(--border);
      transition: border-color .2s, background .2s;
    }
    .flow-node:hover { border-color: var(--border-strong); background: var(--surface-3); }
    .flow-node.accent { border-color: var(--primary-mid); background: var(--primary-light); }
    .flow-sep { display: flex; align-items: center; justify-content: center; padding: 0 14px; color: var(--text-tertiary); flex-shrink: 0; }
    .flow-sep svg { width: 18px; height: 18px; }
    .flow-node-tag { font-size: 9px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; color: var(--text-secondary); display: flex; align-items: center; gap: 5px; }
    .flow-node-tag-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .flow-node-amt { font-size: 17px; font-weight: 700; letter-spacing: -.3px; line-height: 1; }
    .flow-node-amt.green { color: var(--success); }
    .flow-node-amt.red   { color: var(--danger); }
    .flow-node-amt.blue  { color: var(--primary); }
    .flow-node-sub { font-size: 10px; color: var(--text-tertiary); }
    .legend-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      padding: 0 24px 16px;
      border-top: 1px solid var(--border);
      margin-top: 4px;
    }
    .leg-item {
      display: flex; flex-direction: column; gap: 4px;
      padding: 10px 16px;
      border-right: 1px solid var(--border);
    }
    .leg-item:last-child { border-right: none; }
    .leg-item:first-child { padding-left: 0; }
    .leg-top { display: flex; align-items: center; gap: 7px; }
    .leg-swatch { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
    .leg-name { font-size: 11px; font-weight: 500; color: var(--text-secondary); }
    .leg-amt { font-size: 13px; font-weight: 700; color: var(--text-primary); letter-spacing: -.2px; }
    .leg-pct { font-size: 10px; font-weight: 500; color: var(--text-tertiary); }


    /* âââ Detail Sections âââââââââââââââââââââââââââââââââââââ */
    .sections-col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      align-items: start;
    }
    @media(max-width:900px) { .sections-col { grid-template-columns: 1fr; } }

    .section-card {
      background: var(--surface-1);
      border: none;
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      transition: box-shadow .2s, transform .2s;
    }
    .section-card:hover { box-shadow: var(--shadow-card-hover); transform: translateY(-1px); }

    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }
    .section-icon {
      width: 38px; height: 38px;
      border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .section-icon svg { width:18px; height:18px; }
    .section-icon.earnings  { background: rgba(45,206,137,.12); color: var(--success); }
    .section-icon.deductions{ background: rgba(245,54,92,.10);  color: var(--danger);  }
    .section-icon.contrib    { background: rgba(94,114,228,.12); color: var(--primary); }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: .1px;
      flex: 1;
      min-width: 0;
    }
    .section-total {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
    }
    .section-total.green  { color: var(--success); }
    .section-total.red    { color: var(--danger);  }
    .section-total.blue   { color: var(--primary); }
    .section-total.muted  { color: var(--text-secondary); }

    /* % pill next to section total */
    .section-pct-pill {
      display: inline-flex; align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10px; font-weight: 700;
      letter-spacing: .3px;
      margin-left: 6px;
      flex-shrink: 0;
    }
    .section-pct-pill.green { background: var(--success-light); color: var(--success); }
    .section-pct-pill.red   { background: var(--danger-light);  color: var(--danger);  }
    .section-pct-pill.red.over-limit { background: var(--danger); color: #fff; animation: pulse-badge .9s ease-in-out infinite alternate; }
    .section-pct-pill.blue  { background: var(--primary-light); color: var(--primary); }

    @keyframes pulse-badge {
      from { box-shadow: 0 0 0 0 rgba(245,54,92,.5); }
      to   { box-shadow: 0 0 0 5px rgba(245,54,92,0); }
    }

    /* 50% deduction limit warning banner */
    .deduction-limit-banner {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 16px;
      background: var(--danger-light);
      border-bottom: 1px solid rgba(245,54,92,.2);
      border-left: 3px solid var(--danger);
    }
    .dlb-icon { flex-shrink: 0; color: var(--danger); margin-top: 1px; }
    .dlb-icon svg { width: 15px; height: 15px; }
    .dlb-body { flex: 1; }
    .dlb-title { font-size: 12px; font-weight: 700; color: var(--danger); margin-bottom: 2px; }
    .dlb-text  { font-size: 11px; color: #b91c1c; line-height: 1.5; }

    /* Group rows within a section */
    .group-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px 14px;
      background: var(--surface-2);

    .group-header-label.blue  { color: var(--primary); }

      font-size: 12px;

      color: var(--success);

      color: var(--text-primary);
      flex: 1;
    }

      font-size: 13px;

    /* âââ Download Bar ââââââââââââââââââââââââââââââââââââââââ */
    .download-bar {
      margin-top: 24px;

      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

      display: inline-flex;

    /* âââ Animations ââââââââââââââââââââââââââââââââââââââââââ */
    @keyframes fadeSlideUp {
      from { opacity:0; transform:translateY(12px); }

<script>
/* ─── Helper: build sections (must be defined before PAYSLIPS) ────────────── */
function earningsSections(basic, allowance, epfEmp, socsoEmp, eisEmp, epfEr, socsoEr, eisEr, hrd, incentives = [], bonuses = []) {
  const incentiveTotal = incentives.reduce((s, i) => s + i.amount, 0);
  const bonusTotal     = bonuses.reduce((s, i) => s + i.amount, 0);
  const earningsTotal  = basic + allowance + incentiveTotal + bonusTotal;
  const groups = [
    {
      label:'Regular Pay', total: basic + allowance, colorClass:'green',
      items:[
        { icon:'basic',     name:'Basic',     amount: basic     },
        { icon:'allowance', name:'Allowance', amount: allowance },
      ]
    },
  ];
  if (incentives.length) {
    groups.push({
      label:'Incentives', total: incentiveTotal, colorClass:'green',
      items: incentives,
    });
  }
  if (bonuses.length) {
    groups.push({
      label:'Bonus', total: bonusTotal, colorClass:'green',
      items: bonuses,
    });
  }
  return [
    {
      type:'earnings', title:'Earnings', total: earningsTotal,
      groups,
    },
    {
      type:'deductions', title:'Deductions', total: epfEmp + socsoEmp + eisEmp,
      groups:[{ label:'Stat. Deductions', total: epfEmp+socsoEmp+eisEmp, colorClass:'red',
        items:[
          { icon:'tax',  name:'Employee EPF',   amount: epfEmp   },
          { icon:'eis',  name:'Employee SOCSO', amount: socsoEmp },
          { icon:'eis',  name:'Employee EIS',   amount: eisEmp   },
        ]
      }]
    },
    {
      type:'contrib', title:'Company Stat. Contribution', total: epfEr + socsoEr + eisEr + hrd,
      groups:[{ label:'Company Contributions', total: epfEr+socsoEr+eisEr+hrd, colorClass:'blue',
        items:[
          { icon:'epf',   name:'Employer EPF',   amount: epfEr   },
          { icon:'socso', name:'Employer SOCSO', amount: socsoEr },
          { icon:'eis',   name:'Employer EIS',   amount: eisEr   },
          { icon:'hrd',   name:'HRD Levy',       amount: hrd     },
        ]
      }]
    },
  ];
}

/* ─── Mock API data ───────────────────────────────────────────────────────── */
// Simulates: endpoint 1 = list of payslips per month, endpoint 2 = payslip detail
// Each month entry has an array of cycles; single-cycle months have just ['ME']
const MONTHS = [
  { label: 'January 2026',  cycles: ['ME'] },
  { label: 'February 2026', cycles: ['1E', 'ME'] },
  { label: 'March 2026',    cycles: ['ME'] },
];

// Per-cycle payslip data keyed by "Month label|cycle"

/* ─── State ───────────────────────────────────────────────────────────────── */
let activeTab       = 'monthly';
let activeCycle     = 'all';   // 'all' | '1E' | 'ME'

/* ─── Helpers ─────────────────────────────────────────────────────────────── */
const fmt = v => v.toLocaleString('en-MY', { minimumFractionDigits:2, maximumFractionDigits:2 });

function currentMonth() { return MONTHS[currentMonthIdx]; }

function getActiveData() {
  const m = currentMonth();
  if (activeCycle === 'all') {
    // Merge all cycles for this month
    const slips = m.cycles.map(c => PAYSLIPS[`${m.label}|${c}`]).filter(Boolean);
    if (slips.length === 1) return slips[0];
    // Sum across cycles
    const merged = {
      gross: slips.reduce((s,d) => s + d.gross, 0),
      nett:  slips.reduce((s,d) => s + d.nett,  0),
      chartSegments: mergeSegments(slips),
      sections: mergeSections(slips),
    };
    const totalDed = merged.gross - merged.nett;
    merged.deductionRatio = (totalDed / merged.gross) * 100;
    return merged;
  }
  return PAYSLIPS[`${m.label}|${activeCycle}`] || {};
}

function mergeSegments(slips) {
  const map = {};
  slips.forEach(d => d.chartSegments.forEach(s => {
    if (!map[s.label]) map[s.label] = { ...s, value: 0 };
    map[s.label].value += s.value;
  }));
  return Object.values(map);
}

function mergeSections(slips) {
  // Deep-merge sections by type, groups by label, items by name
  const base = JSON.parse(JSON.stringify(slips[0].sections));
  for (let i = 1; i < slips.length; i++) {
    slips[i].sections.forEach(sec => {
      const baseSec = base.find(s => s.type === sec.type);
      if (!baseSec) return;
      baseSec.total += sec.total;
      sec.groups.forEach(grp => {
        const baseGrp = baseSec.groups.find(g => g.label === grp.label);
        if (baseGrp) {
          baseGrp.total += grp.total;
          grp.items.forEach(item => {
            const baseItem = baseGrp.items.find(it => it.name === item.name);
            if (baseItem) baseItem.amount += item.amount;
            else baseGrp.items.push({ ...item });
          });
        } else {
          baseSec.groups.push(JSON.parse(JSON.stringify(grp)));
        }
      });
    });
  }
  return base;
}

function cycleSplitHint(m) {
  if (m.cycles.length < 2 || activeCycle !== 'all') return '';
  const parts = m.cycles.map(c => {
    const d = PAYSLIPS[`${m.label}|${c}`];
    return d ? `${c}: MYR ${fmt(d.nett)}` : '';
  }).filter(Boolean);
  return parts.join(' · ');
}

/* ─── Render cycle pills ──────────────────────────────────────────────────── */
function renderCyclePills() {
  const m = currentMonth();
  const row = document.getElementById('cycle-row');
  if (m.cycles.length < 2) {
    row.style.display = 'none';
    activeCycle = 'all';
    return;
  }
  row.style.display = 'flex';
  const pills = ['all', ...m.cycles].map(c => {
    const label = c === 'all' ? 'All' : c === '1E' ? '1st Half (1E)' : 'Month End (ME)';
    const active = activeCycle === c;
    return `<button class="cycle-pill ${active ? 'active' : ''}" onclick="switchCycle('${c}')">
      <span class="cycle-pill-dot"></span>${label}
    </button>`;
  }).join('');
  row.innerHTML = `<span class="cycle-label">Cycle</span>${pills}`;
}

/* ─── Render KPI cards ────────────────────────────────────────────────────── */
function renderKPIs(d) {
  const m = currentMonth();
  const ytd = YTD[m.label] || { gross: d.gross, nett: d.nett };
  const hint = cycleSplitHint(m);
  const kpis = [
    { label:'Gross Salary',     value: d.gross,   accent:'var(--success)', sub: null },
    { label:'Nett Salary',      value: d.nett,    accent:'var(--primary)', sub: hint },
    { label:'YTD Gross Salary', value: ytd.gross, accent:'var(--info)',    sub: null },
    { label:'YTD Nett Salary',  value: ytd.nett,  accent:'var(--warning)', sub: null },
  ];
  document.getElementById('kpi-grid').innerHTML = kpis.map(k => `
    <div class="kpi-card" style="border-top:3px solid ${k.accent};">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-value"><span class="kpi-currency">MYR</span>${fmt(k.value)}</div>
      ${k.sub ? `<div class="kpi-sub">${k.sub}</div>` : ''}
    </div>`).join('');
}

/* ─── Render sections ─────────────────────────────────────────────────────── */
function renderSections(d) {
  const col = document.getElementById('sections-col');
  const sectionTypeClass = { earnings:'earnings', deductions:'deductions', contrib:'contrib' };
  const totalColorClass  = { earnings:'green',    deductions:'red',        contrib:'blue'   };
  const gross = d.gross || 1;

  // Employee deduction total for 50% law check
  const dedSec = d.sections.find(s => s.type === 'deductions');
  const dedTotal = dedSec ? dedSec.total : 0;
  const dedPct   = (dedTotal / gross) * 100;
  const overLimit = dedPct > 50;

  col.innerHTML = d.sections.map((sec, si) => {
    const tcls = totalColorClass[sec.type] || 'muted';
    const icls = sectionTypeClass[sec.type] || 'earnings';
    const pct  = gross > 0 ? (sec.total / gross * 100) : 0;
    const isOverLimit = sec.type === 'deductions' && overLimit;

    const sectionIconSVG = {
      earnings:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 12h6M12 9v6"/></svg>`,
      deductions: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>`,
      contrib:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="18" x2="12" y2="21"/></svg>`,
    }[sec.type];

    const pctPill = `<span class="section-pct-pill ${tcls}${isOverLimit ? ' over-limit' : ''}" title="${pct.toFixed(1)}% of gross salary">${pct.toFixed(1)}%</span>`;

    const limitBanner = isOverLimit ? `
      <div class="deduction-limit-banner" role="alert">
        <div class="dlb-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </div>
        <div class="dlb-body">
          <div class="dlb-title">Deduction Limit Exceeded (${pct.toFixed(1)}%)</div>
          <div class="dlb-text">Under Malaysian labour law, total employee deductions cannot exceed 50% of monthly salary. Please review and adjust before processing payroll.</div>
        </div>
      </div>` : '';

    const groups = sec.groups.map((grp, gi) => {
      const key = `${si}-${gi}`;
      if (expandStates[key] === undefined) expandStates[key] = true;
      const open = expandStates[key];
      const items = grp.items.map(item => {
        const ic = getItemIcon(item.icon);
        return `<div class="line-item">
          <div class="line-item-icon" style="background:${ic.color}18;color:${ic.color}">${ic.svg}</div>
          <span class="line-item-name">${item.name}</span>
          <span class="line-item-amount">${fmt(item.amount)}</span>
        </div>`;
      }).join('');
      return `
        <div class="group-header-row">
          <span class="group-header-label ${grp.colorClass}">${grp.label}</span>
          <span class="group-header-amount ${grp.colorClass}">${fmt(grp.total)}</span>
          <button class="expand-toggle ${open?'open':''}" onclick="toggleGroup(${si},${gi})" aria-expanded="${open}" aria-label="Toggle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>
        <div class="sub-rows ${open?'':'collapsed'}" id="subrows-${si}-${gi}"
             style="max-height:${open ? grp.items.length*52+'px' : '0'}">
          ${items}
        </div>`;
    }).join('');

    return `<div class="section-card">
      <div class="section-header">
        <div class="section-icon ${icls}">${sectionIconSVG}</div>
        <span class="section-title">${sec.title}</span>
        <div style="margin-left:auto;display:flex;align-items:center;gap:0;flex-shrink:0;">
          <span class="section-total ${tcls}">MYR&nbsp;${fmt(sec.total)}</span>
          ${pctPill}
        </div>
      </div>
      ${limitBanner}
      ${sec.groups.length ? groups : '<div class="section-empty">No records for this period.</div>'}
    </div>`;
  }).join('');
}

/* ─── Toggle expand ───────────────────────────────────────────────────────── */
function toggleGroup(si, gi) {
  const key = `${si}-${gi}`;
  expandStates[key] = !expandStates[key];
  const subrows = document.getElementById(`subrows-${si}-${gi}`);
  const btn = subrows.previousElementSibling.querySelector('.expand-toggle');
  const open = expandStates[key];
  subrows.style.maxHeight = open ? subrows.querySelectorAll('.line-item').length * 52 + 'px' : '0';
  subrows.classList.toggle('collapsed', !open);
  btn.classList.toggle('open', open);
  btn.setAttribute('aria-expanded', open);
}

/* ─── Render breakdown card (stacked bar + flow nodes + legend) ─────────── */
function renderBreakdown(d) {
  const segs = d.chartSegments.filter(s => s.value > 0).sort((a,b) => (a.label==='Stat. Ded'?1:-1) - (b.label==='Stat. Ded'?1:-1));
  const cssVars = getComputedStyle(document.documentElement);
  const resolved = segs.map(s => ({
    ...s,
    color: s.colorVar ? cssVars.getPropertyValue(s.colorVar).trim() : (s.color || '#888')
  }));
  const total = resolved.reduce((s, sg) => s + sg.value, 0);
  const dedAmt = (d.deductionRatio || 0) / 100 * d.gross;

  const barSegs = resolved.map(s => {
    const pct = (s.value / total * 100);
    return `<div class="bar-seg" style="flex:${pct.toFixed(2)};background:${s.color}" title="${s.label}: MYR ${fmt(s.value)}">
      <span class="bar-seg-lbl">${pct > 8 ? s.label : ''}</span>
    </div>`;
  }).join('');

  const legend = resolved.map(s => `
    <div class="leg-item">
      <div class="leg-top">
        <div class="leg-swatch" style="background:${s.color}"></div>
        <span class="leg-name">${s.label}</span>
      </div>
      <span class="leg-amt">MYR ${fmt(s.value)}</span>
    </div>`).join('');

  const title = activeTab === 'ytd' ? 'YTD Pay Breakdown' : 'Monthly Pay Breakdown';

  document.getElementById('breakdown-card').innerHTML = `
    <div class="bc-header">
      <span class="bc-title">${title}</span>
      <div class="bc-chips">
        <span class="bc-chip green">Earnings MYR ${fmt(d.gross)}</span>
        <span class="bc-chip red">Deductions MYR ${fmt(dedAmt)}</span>
      </div>
    </div>
    <div class="flow-row">
      <div class="flow-node">
        <div class="flow-node-tag"><span class="flow-node-tag-dot" style="background:var(--success)"></span>Gross</div>
        <div class="flow-node-amt green">MYR ${fmt(d.gross)}</div>
        <div class="flow-node-sub">Total earnings</div>
      </div>
      <div class="flow-sep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>
      <div class="flow-node">
        <div class="flow-node-tag"><span class="flow-node-tag-dot" style="background:var(--danger)"></span>Deductions</div>
        <div class="flow-node-amt red">− MYR ${fmt(dedAmt)}</div>
        <div class="flow-node-sub">Statutory contributions</div>
      </div>
      <div class="flow-sep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>
      <div class="flow-node accent">
        <div class="flow-node-tag"><span class="flow-node-tag-dot" style="background:var(--primary)"></span>Net Pay</div>
        <div class="flow-node-amt blue">MYR ${fmt(d.nett)}</div>
        <div class="flow-node-sub">Amount received</div>
      </div>
    </div>
    <div class="bar-section">
      <div class="bar-track">${barSegs}</div>
    </div>
    <div class="legend-grid">${legend}</div>`;


}

/* ─── Full render ─────────────────────────────────────────────────────────── */
function render() {
  const m = currentMonth();
  const d = activeTab === 'ytd'
    ? buildYTDView(m)
    : getActiveData();

  document.getElementById('period-label').textContent = m.label;

  renderCyclePills();
  renderKPIs(d);
  renderBreakdown(d);
  renderSections(d);
}

function buildYTDView(m) {
  // Sum all slips up to and including current month
  const ytd = YTD[m.label] || { gross: 0, nett: 0 };
  // Collect all slips for this month to get segments & sections structure
  const slips = m.cycles.map(c => PAYSLIPS[`${m.label}|${c}`]).filter(Boolean);
  const monthData = slips.length > 1 ? (() => {
    const merged = { gross: slips.reduce((s,d)=>s+d.gross,0), nett: slips.reduce((s,d)=>s+d.nett,0), chartSegments: mergeSegments(slips), sections: mergeSections(slips) };
    merged.deductionRatio = ((merged.gross - merged.nett) / merged.gross) * 100;
    return merged;
  })() : slips[0];
  // Scale factor from monthly to YTD
  const scale = monthData ? ytd.gross / monthData.gross : 1;
  const totalDed = ytd.gross - ytd.nett;
  return {
    gross: ytd.gross,
    nett:  ytd.nett,
    deductionRatio: (totalDed / ytd.gross) * 100,
    chartSegments: (monthData?.chartSegments || []).map(s => ({ ...s, value: s.value * scale })),
    sections: (monthData?.sections || []).map(sec => ({
      ...sec,
      total: sec.total * scale,
      groups: sec.groups.map(grp => ({
        ...grp,
        total: grp.total * scale,
        items: grp.items.map(item => ({ ...item, amount: item.amount * scale })),
      })),
    })),
  };
}

/* ─── Navigation ──────────────────────────────────────────────────────────── */
function navPeriod(dir) {
  const next = currentMonthIdx + dir;
  if (next < 0 || next >= MONTHS.length) return;
  currentMonthIdx = next;
  activeCycle = 'all';
  expandStates = {};
  render();
}

function switchTab(tab) {
  activeTab = tab;
  expandStates = {};
  document.getElementById('tab-monthly').classList.toggle('active', tab === 'monthly');
  document.getElementById('tab-ytd').classList.toggle('active', tab === 'ytd');
  document.getElementById('tab-monthly').setAttribute('aria-selected', tab === 'monthly');
  document.getElementById('tab-ytd').setAttribute('aria-selected', tab === 'ytd');
  render();
}

function switchCycle(cycle) {
  activeCycle = cycle;
  expandStates = {};
  render();
}

function downloadPayslip() {
  const m = currentMonth();
  const cycleLabel = activeCycle === 'all' ? 'All' : activeCycle;
  alert(`Downloading PDF: ${m.label} — ${cycleLabel}`);
}

/* ─── Sidebar ─────────────────────────────────────────────────────────────── */
function sbToggleSubmenu(submenuId, parentEl) {
  const submenu = document.getElementById(submenuId);
  const chevron = parentEl.querySelector('.sb-chevron');
  if (!submenu) return;
  const isOpen = submenu.classList.toggle('open');
  if (chevron) chevron.classList.toggle('open', isOpen);
}

/* ─── Init ────────────────────────────────────────────────────────────────── */
render();
</script>


</div><!-- /main-wrap -->
</body>
